name: OBD_Viewer_Logger
options:
  xcodeVersion: "2620" # Xcode 26.2。LastUpgradeCheckを合わせ「Update to recommended settings」警告を出さない
  bundleIdPrefix: com.nak435
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RealmSwift:
    url: https://github.com/realm/realm-swift
    from: 10.49.0

targets:
  OBD_Viewer_Logger:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OBD_Viewer_Logger
    dependencies:
      - package: RealmSwift
        product: RealmSwift
        embed: true # 動的フレームワークとして提供されるため、実機ではアプリ内に埋め込みが必須
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nak435.OBD-Viewer-Logger
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OBD_Viewer_Logger/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2" # 1=iPhone, 2=iPad
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UNKNOWN # 公開用のダミー。ビルド時に DEVELOPMENT_TEAM=<自分のTeamID> をコマンドで上書きする
